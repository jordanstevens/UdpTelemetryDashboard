<!DOCTYPE html>
<html lang = 'en'>
   <head>
      <meta charset="utf-8">
      <title>Telemetry Dashboard</title>
      <link rel = "stylesheet" type = "text/css" href = "/static/TelemetryDashboard.css">
   </head>
   <body>      
      <div class = "main">
         <div class = "header">
            <div class = "general">
               <span class = "bottom" id = "status">Waiting for transmission..</span>
               <span class = "time" id = "time">0</span>
               <span class = "sequence" id = "seq">0</span>            
            </div>            
         </div>
         <div class="charts" id="charts">
            <div class="chart_wrapper">
               <span class = "signal" id = "signal">0</span>
               <canvas id="signal_chart"></canvas>
            </div>
            <div class="chart_wrapper">
               <span class = "volt" id = "volts">0.00</span>
               <canvas id="volt_chart"></canvas>
            </div>
         </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <script src="/static/TelemetryDashboard.js"></script>   
   </body>

</html>
